name: Bug report
description: Something is broken in the app.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include secrets or personal data.
        If this is a security issue, use the private process in SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Select region ...
        3. See error
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region and date range (if relevant)
      placeholder: "e.g. bbox -12,-75,-9,-72 · 2015-01 to 2020-12"
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Mobile
        - Tablet
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Firefox 132, Safari iOS 18"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshot
      description: Paste only the relevant fragment, not the whole log.

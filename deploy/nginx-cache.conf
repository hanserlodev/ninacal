# Snippet para el server block de NinaCal en Nginx.
# Ya existe FILAM en 80/443; añade esto SOLO al server de
# 5.189.178.36.sslip.io (o del dominio final), no al de FILAM.

# ---------- Nivel http{} ----------
proxy_cache_path /var/cache/nginx/ninacal levels=1:2 keys_zone=ninacal:20m
                 max_size=2g inactive=7d use_temp_path=off;

limit_req_zone  $binary_remote_addr zone=ninacal_rl:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ninacal_conn:10m;

# Los CSV de celdas son grandes y no deben ocupar la caché.
map $arg_format $ninacal_nocache {
    cells 1;
    default 0;
}

# ---------- Nivel server{} ----------
# HSTS una sola vez por server.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# ---------- Locations ----------
location = /data/manifest.json {
    proxy_pass http://127.0.0.1:8080;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /data/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_cache ninacal;
    proxy_cache_lock on;
    proxy_cache_valid 200 1h;
    proxy_cache_valid 404 1m;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /api/ {
    proxy_pass http://127.0.0.1:8080;

    # El upstream ya envía CORS y Cache-Control; ocultarlos evita cabeceras
    # duplicadas (dos Access-Control-Allow-Origin rompen CORS en el navegador).
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Cache-Control;

    proxy_cache ninacal;
    proxy_cache_methods GET HEAD;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_no_cache     $ninacal_nocache;
    proxy_cache_bypass $ninacal_nocache;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_header_timeout 5s;
    client_body_timeout 10s;

    limit_req  zone=ninacal_rl burst=30 nodelay;
    limit_conn ninacal_conn 10;

    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Max-Age "86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

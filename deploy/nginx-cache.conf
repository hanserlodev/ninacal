# Snippet para el server block de NinaCal en Nginx.
# Ya existe FILAM en 80/443; añade esto SOLO al server de
# 5.189.178.36.sslip.io (o del dominio final), no al de FILAM.

# Fuera del server{} (nivel http):
proxy_cache_path /var/cache/nginx/ninacal levels=1:2 keys_zone=ninacal:20m
                 max_size=2g inactive=7d use_temp_path=off;

# Dentro del server{} de la API:
location = /data/manifest.json {
    proxy_pass http://127.0.0.1:8080;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location /data/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_cache ninacal;
    proxy_cache_valid 200 1h;
    proxy_cache_valid 404 1m;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_cache ninacal;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
}

# POST /api/region (polígonos) no debe cachearse:
proxy_cache_bypass $request_method;
proxy_no_cache $request_method;
